<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FindIT School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#0f3b7a',
                        'brand-orange': '#e67e22',
                        'sidebar': '#0f172a'
                    },
                    boxShadow: {
                        'premium': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar text-gray-300 flex flex-col shadow-2xl z-30 transition-all duration-300">
        <div class="h-24 flex items-center justify-center border-b border-gray-800 bg-black/20 p-4">
            <img src="logo.png" alt="FindIT" class="h-12 w-auto brightness-0 invert object-contain">
        </div>
        
        <nav class="flex-grow py-6 px-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/10 text-white rounded-xl font-bold border-l-4 border-brand-orange transition-all">
                <svg class="w-5 h-5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Registar Objetos
            </a>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 hover:text-white rounded-xl font-medium transition-all">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Ver Site Público
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800">
            <button id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white font-bold py-3 rounded-xl transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Terminar Sessão
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col overflow-y-auto bg-gray-50 relative">
        
        <header class="bg-white/80 backdrop-blur-md shadow-sm h-20 flex items-center justify-between px-8 sticky top-0 z-20 border-b border-gray-100">
            <h1 class="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Gestão de Objetos
            </h1>
            
            <div class="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-full px-2 py-1.5 pr-4">
                <div class="w-8 h-8 bg-brand-blue rounded-full flex items-center justify-center text-white font-bold text-xs">AD</div>
                <span id="user-email" class="text-sm font-bold text-gray-700">A carregar...</span>
            </div>
        </header>

        <div class="p-8 max-w-6xl mx-auto w-full space-y-8">
            
            <!-- Formulário Premium -->
            <div class="bg-white rounded-3xl shadow-premium border border-gray-100 overflow-hidden">
                <div class="px-8 py-6 border-b border-gray-100 bg-gray-50/50">
                    <h2 class="text-lg font-extrabold text-brand-blue">Registar Novo Objeto</h2>
                    <p class="text-sm text-gray-500 mt-1">Preenche os dados do objeto encontrado.</p>
                </div>
                
                <form id="form-objeto" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="block text-sm font-bold text-gray-700">Título do Objeto</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                            </div>
                            <input type="text" id="titulo" required placeholder="Ex: AirPods Brancos" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-orange focus:bg-white transition-all">
                        </div>
                    </div>
                    
                    <div class="space-y-1">
                        <label class="block text-sm font-bold text-gray-700">Categoria</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            </div>
                            <select id="categoria" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-orange focus:bg-white transition-all appearance-none">
                                <option value="Eletrónica">Eletrónica</option>
                                <option value="Roupa">Roupa</option>
                                <option value="Material Escolar">Material Escolar</option>
                                <option value="Chaves">Chaves</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1 md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700">Sala / Local</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <input type="text" id="sala" required placeholder="Ex: Sala 1.6, Pavilhão, Refeitório..." class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-orange focus:bg-white transition-all">
                        </div>
                    </div>

                    <!-- Upload de Ficheiro com Pré-visualização e Contador -->
                    <div class="space-y-1 md:col-span-2 mt-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Fotografia (Obrigatório)</label>
                        
                        <div id="dropzone" class="mt-1 flex flex-col justify-center items-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-brand-blue transition-colors bg-gray-50 hover:bg-blue-50/30 cursor-pointer relative group">
                            <input id="foto" type="file" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            
                            <div id="upload-placeholder" class="space-y-1 text-center">
                                <svg class="mx-auto h-12 w-12 text-gray-400 group-hover:text-brand-blue transition-colors" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <div class="flex text-sm text-gray-600 justify-center">
                                    <span class="relative rounded-md font-bold text-brand-blue hover:text-blue-800">Carregar um ficheiro</span>
                                    <p class="pl-1">ou arrastar e largar</p>
                                </div>
                                <p class="text-xs text-gray-500">PNG, JPG, GIF até 10MB</p>
                            </div>

                            <div id="image-preview" class="hidden w-full h-48 relative">
                                <img id="preview-img" src="" alt="Preview" class="w-full h-full object-contain rounded-lg">
                            </div>
                        </div>
                        
                        <div id="file-size-info" class="hidden text-sm font-bold text-brand-blue mt-2 text-right">
                            Tamanho: <span id="file-size-text">0</span> MB
                        </div>
                    </div>

                    <div class="md:col-span-2 flex justify-end mt-4">
                        <button type="submit" id="btn-submit" class="bg-brand-blue text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-900 hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Guardar Objeto
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabela Premium -->
            <div class="bg-white rounded-3xl shadow-premium border border-gray-100 overflow-hidden">
                <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h2 class="text-lg font-extrabold text-brand-blue">Objetos no Sistema</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white text-gray-400 text-xs uppercase tracking-wider border-b border-gray-100">
                                <th class="p-5 font-bold">Fotografia</th>
                                <th class="p-5 font-bold">Título / Categoria</th>
                                <th class="p-5 font-bold">Localização</th>
                                <th class="p-5 font-bold">Estado</th>
                                <th class="p-5 font-bold text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="divide-y divide-gray-50">
                            <!-- Inserido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste FindIT School</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Estilo simples para o botão */
        .btn { background-color: #e67e22; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 300px; }
    </style>
</head>
<body class="bg-gray-100 p-10 font-sans">

    <h1 class="text-3xl font-bold text-blue-900 mb-6">Teste FindIT School</h1>

    <!-- Botão que abre o modal -->
    <button id="btn-abrir" class="btn">Entrar / Registar</button>

    <!-- O Modal (Janela) -->
    <div id="meu-modal" class="modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold mb-4">Login / Registo</h2>
            
            <input type="email" id="email" placeholder="O teu email" class="border p-2 w-full mb-2 rounded">
            <input type="password" id="senha" placeholder="A tua password" class="border p-2 w-full mb-4 rounded">
            
            <button id="btn-login" class="btn w-full mb-2">Fazer Login</button>
            <button id="btn-fechar" class="text-gray-500 w-full text-sm hover:underline">Fechar</button>
            
            <p id="msg" class="text-center mt-4 text-sm font-bold text-red-500"></p>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // 1. COLOCA AS TUAS CHAVES AQUI
        const SUPABASE_URL = 'https://kswqakffuudugnfudizg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XM9rWUkcESRXVrKFFlgNDA_VZ8XgXJl';

        // 2. Iniciar o Supabase
        const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Elementos do HTML
        const btnAbrir = document.getElementById('btn-abrir');
        const modal = document.getElementById('meu-modal');
        const btnFechar = document.getElementById('btn-fechar');
        const btnLogin = document.getElementById('btn-login');
        const msg = document.getElementById('msg');

        // 4. Abrir e Fechar Modal
        btnAbrir.addEventListener('click', () => {
            modal.classList.add('active');
        });

        btnFechar.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // 5. Lógica de Login
        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            msg.textContent = "A tentar entrar...";
            msg.className = "text-center mt-4 text-sm font-bold text-blue-500";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha,
            });

            if (error) {
                msg.textContent = "Erro: " + error.message;
                msg.className = "text-center mt-4 text-sm font-bold text-red-500";
            } else {
                msg.textContent = "Login com sucesso!";
                msg.className = "text-center mt-4 text-sm font-bold text-green-500";
                setTimeout(() => modal.classList.remove('active'), 1500);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIT School - Objetos Perdidos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração das Cores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'marca-azul': '#0f3b7a',
                        'marca-laranja': '#e67e22',
                    },
                    boxShadow: {
                        'suave': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Cabeçalho Moderno -->
    <header class="bg-white/90 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 md:h-24 flex items-center justify-between">
            
            <a href="index.html" class="flex items-center gap-2 group">
                <img src="logo.png" alt="FindIT School" class="h-16 md:h-20 w-auto object-contain transition-transform group-hover:scale-105">
            </a>
            
            <div class="flex items-center gap-4">
                <!-- Botão Entrar (Escondido quando logado) -->
                <button onclick="abrirModal()" id="btn-login-nav" class="btn-premium min-h-[44px] flex items-center">
                    Entrar
                </button>
                
                <!-- Botão Ir para o Painel (Aparece quando logado) -->
                <a href="dashboard.html" id="btn-dashboard-nav" class="hidden min-h-[44px] bg-marca-azul text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-900 transition-all duration-200 flex items-center">
                    Ir para o Painel
                </a>

                <!-- Botão Sair (Aparece quando logado) -->
                <button onclick="fazerLogout()" id="btn-logout-nav" class="hidden min-h-[44px] bg-red-500 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-red-600 transition-all duration-200 flex items-center">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="hero-mesh text-white py-16 px-4 text-center relative overflow-hidden">
            <div class="relative z-10 max-w-4xl mx-auto">
                <h1 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight drop-shadow-lg leading-tight">
                    Encontra o que <span class="text-marca-laranja">perdeste.</span>
                </h1>
                <p class="text-lg md:text-xl text-blue-100 mb-10 max-w-2xl mx-auto font-medium">
                    Consulta o catálogo em tempo real ou cria um alerta para seres notificado assim que o teu objeto aparecer.
                </p>
                
                <div class="max-w-3xl mx-auto flex flex-col sm:flex-row gap-3 justify-center p-2">
                    <div class="flex-grow flex gap-2 bg-white rounded-2xl shadow-xl p-1">
                        <input type="text" id="pesquisa" placeholder="O que procuras? (ex: AirPods, Casaco...)" class="input-premium w-full min-h-[50px] px-5 py-3 rounded-xl text-gray-800 bg-gray-50">
                        <button onclick="carregarObjetos()" class="min-h-[50px] bg-marca-azul text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-900 transition-all shadow-md hover:shadow-lg">
                            Pesquisar
                        </button>
                    </div>
                    <button onclick="alert('Em breve: Formulário de Alerta')" class="btn-alerta min-h-[50px] bg-white text-marca-azul px-6 py-3 rounded-2xl font-bold shadow-xl hover:bg-gray-50 transition-all flex items-center justify-center gap-2 border-2 border-transparent hover:border-marca-laranja">
                        <svg class="w-6 h-6 text-marca-laranja" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        Criar Alerta
                    </button>
                </div>
            </div>
        </section>

        <!-- Filtros Rápidos -->
        <section class="max-w-7xl mx-auto px-4 pt-12 pb-4 relative z-20 -mt-8">
            <div class="bg-white rounded-2xl shadow-lg p-4 flex flex-wrap gap-3 justify-center border border-gray-100">
                <button onclick="filtrarPorCategoria('Todos')" class="filter-btn active px-6 py-2.5 rounded-full text-sm font-bold bg-white text-gray-600 hover:bg-gray-50">Todos</button>
                <button onclick="filtrarPorCategoria('Eletrónica')" class="filter-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Eletrónica</button>
                <button onclick="filtrarPorCategoria('Roupa')" class="filter-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Roupa</button>
                <button onclick="filtrarPorCategoria('Material Escolar')" class="filter-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Material Escolar</button>
                <button onclick="filtrarPorCategoria('Chaves')" class="filter-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Chaves</button>
            </div>
        </section>

        <!-- Catálogo -->
        <section class="max-w-7xl mx-auto px-4 py-8 relative z-10">
            <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <!-- Os cartões entram aqui -->
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="bg-marca-azul text-blue-200 py-10 text-center mt-auto relative z-10">
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
            <img src="logo.png" alt="FindIT" class="h-10 mb-4 opacity-50 grayscale hover:grayscale-0 transition-all duration-300">
            <p class="text-sm font-medium">&copy; 2026 FindIT School - Rafael Rodrigues. PAP.</p>
        </div>
    </footer>

    <!-- MODAL DE LOGIN -->
    <div id="modal-login" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-md transition-opacity duration-300">
        <div class="modal-content bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 relative">
            <button onclick="fecharModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-full w-10 h-10 flex items-center justify-center text-2xl font-bold transition-colors">&times;</button>
            
            <div class="text-center mb-8">
                <img src="logo.png" alt="FindIT" class="h-20 mx-auto mb-4 drop-shadow-md">
                <h2 class="text-2xl font-extrabold text-marca-azul tracking-tight">Área Restrita</h2>
                <p class="text-gray-500 text-sm mt-1 font-medium">Acesso exclusivo para funcionários da ETPC</p>
            </div>

            <div id="msg-erro" class="text-red-500 text-sm text-center mb-4 hidden font-bold bg-red-50 p-3 rounded-xl border border-red-200"></div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email Institucional</label>
                    <input type="email" id="email" placeholder="funcionario@etpc.pt" class="input-premium w-full min-h-[48px] px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="input-premium w-full min-h-[48px] px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl">
                </div>
                <button onclick="fazerLogin()" class="btn-premium w-full min-h-[48px] py-3 rounded-xl mt-4 text-lg">
                    Entrar no Sistema
                </button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>

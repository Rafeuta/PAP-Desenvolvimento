<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIT School - Objetos Perdidos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração das Cores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'marca-azul': '#0f3b7a',
                        'marca-laranja': '#e67e22',
                    }
                }
            }
        }
    </script>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="logo.png" alt="FindIT School" class="h-14 w-auto object-contain">
            </a>
            <div class="flex items-center gap-4">
                <button onclick="abrirModal()" id="btn-login-nav" class="min-h-[44px] bg-marca-laranja text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-orange-600 transition-all flex items-center">
                    Entrar (Funcionários)
                </button>
                <button onclick="fazerLogout()" id="btn-logout-nav" class="hidden min-h-[44px] bg-red-500 text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-red-600 transition-all flex items-center">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow">
        <!-- Hero Section (Mais compacto) -->
        <section class="bg-gradient-to-br from-marca-azul to-blue-600 text-white py-10 px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3">Encontra o que perdeste.</h1>
            <p class="text-md text-blue-100 mb-6 max-w-2xl mx-auto">Consulta o nosso catálogo de objetos achados na escola ou cria um alerta.</p>
            
            <!-- Barra de Pesquisa e Botão de Alerta -->
            <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-3 justify-center">
                <div class="flex-grow flex gap-2">
                    <input type="text" id="pesquisa" placeholder="Pesquisar por título ou categoria..." class="w-full min-h-[48px] px-4 py-3 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-marca-laranja">
                    <button onclick="carregarObjetos()" class="min-h-[48px] bg-marca-laranja px-6 py-3 rounded-lg font-bold hover:bg-orange-600 shadow-md transition-colors">Pesquisar</button>
                </div>
                <button onclick="alert('Em breve: Formulário de Alerta')" class="min-h-[48px] bg-white text-marca-azul px-6 py-3 rounded-lg font-bold shadow-md hover:bg-gray-100 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    Criar Alerta
                </button>
            </div>
        </section>

        <!-- Filtros Rápidos -->
        <section class="max-w-7xl mx-auto px-4 pt-8 pb-2">
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="filtrarPorCategoria('Todos')" class="filter-btn bg-marca-azul text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-colors">Todos</button>
                <button onclick="filtrarPorCategoria('Eletrónica')" class="filter-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold shadow-sm hover:bg-gray-100 transition-colors">Eletrónica</button>
                <button onclick="filtrarPorCategoria('Roupa')" class="filter-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold shadow-sm hover:bg-gray-100 transition-colors">Roupa</button>
                <button onclick="filtrarPorCategoria('Material Escolar')" class="filter-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold shadow-sm hover:bg-gray-100 transition-colors">Material Escolar</button>
                <button onclick="filtrarPorCategoria('Chaves')" class="filter-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold shadow-sm hover:bg-gray-100 transition-colors">Chaves</button>
            </div>
        </section>

        <!-- Catálogo -->
        <section class="max-w-7xl mx-auto px-4 py-6">
            <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Os cartões entram aqui -->
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="bg-marca-azul text-blue-200 py-6 text-center mt-auto">
        <p>&copy; 2026 FindIT School - Rafael Rodrigues. PAP.</p>
    </footer>

    <!-- MODAL DE LOGIN -->
    <div id="modal-login" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
            <h2 class="text-2xl font-bold text-marca-azul mb-6 text-center">Login Restrito</h2>
            <div id="msg-erro" class="text-red-500 text-sm text-center mb-4 hidden font-bold"></div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full min-h-[44px] px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-marca-azul">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full min-h-[44px] px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-marca-azul">
                </div>
                <button onclick="fazerLogin()" class="w-full min-h-[44px] bg-marca-azul text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition-colors">
                    Entrar
                </button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>

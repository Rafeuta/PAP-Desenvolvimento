<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIT School - Objetos Perdidos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração das Cores do Logótipo -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'marca-azul': '#0f3b7a',
                        'marca-laranja': '#e67e22',
                    }
                }
            }
        }
    </script>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="logo.png" alt="FindIT School" class="h-14 w-auto object-contain">
            </a>
            <div class="flex items-center gap-4">
                <!-- Botão que abre o modal de login -->
                <button onclick="abrirModal()" id="btn-login-nav" class="bg-marca-laranja text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-orange-600 transition-all">
                    Entrar (Funcionários)
                </button>
                <!-- Botão que só aparece depois de fazer login -->
                <button onclick="fazerLogout()" id="btn-logout-nav" class="hidden bg-red-500 text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-red-600 transition-all">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="bg-gradient-to-br from-marca-azul to-blue-600 text-white py-16 px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Encontra o que perdeste.</h1>
            <p class="text-lg text-blue-100 mb-8 max-w-2xl mx-auto">Consulta o nosso catálogo de objetos achados na escola.</p>
            <div class="max-w-xl mx-auto flex gap-2">
                <input type="text" id="pesquisa" placeholder="Pesquisar por título ou categoria..." class="flex-grow px-4 py-3 rounded-lg text-gray-800 focus:outline-none">
                <button onclick="carregarObjetos()" class="bg-marca-laranja px-6 py-3 rounded-lg font-bold hover:bg-orange-600">Pesquisar</button>
            </div>
        </section>

        <!-- Catálogo -->
        <section class="max-w-7xl mx-auto px-4 py-12">
            <h2 class="text-2xl font-bold text-marca-azul mb-6">Objetos Recentes</h2>
            
            <!-- Aqui o JavaScript vai injetar os cartões -->
            <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <p class="text-gray-500 col-span-full">A carregar catálogo...</p>
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="bg-marca-azul text-blue-200 py-6 text-center mt-auto">
        <p>&copy; 2026 FindIT School - Rafael Rodrigues. PAP.</p>
    </footer>

    <!-- ========================================== -->
    <!-- MODAL DE LOGIN (Escondido por defeito) -->
    <!-- ========================================== -->
    <div id="modal-login" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
            
            <h2 class="text-2xl font-bold text-marca-azul mb-6 text-center">Login Restrito</h2>
            
            <div id="msg-erro" class="text-red-500 text-sm text-center mb-4 hidden font-bold"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-marca-azul">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-marca-azul">
                </div>
                <button onclick="fazerLogin()" class="w-full bg-marca-azul text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition-colors">
                    Entrar
                </button>
            </div>
            <p class="text-xs text-gray-500 text-center mt-4">Apenas para funcionários e administradores.</p>
        </div>
    </div>

    <!-- Ligação ao JavaScript -->
    <script src="auth.js"></script>
</body>
</html>
